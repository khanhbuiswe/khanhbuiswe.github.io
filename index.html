    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf9f6;
        --fg: #1c1b19;
        --muted: #6b6963;
        --rule: #b4b2a9;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161615;
          --fg: #eceae4;
          --muted: #9c9a93;
          --rule: #5f5e5a;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
      }

      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        max-width: 36rem;
        margin: 0 auto;
        padding: 20vh 1.5rem 3rem;
        animation: fade-in 400ms ease-out both;
      }

      h1 {
        margin: 0 0 0.25rem;
        font-size: clamp(1.5rem, 4vw, 1.75rem);
        font-weight: 500;
        letter-spacing: -0.01em;
        line-height: 1.25;
      }

      .role,
      .bio {
        font-size: clamp(0.875rem, 2.5vw, 0.95rem);
        line-height: 1.65;
      }

      .role {
        margin: 0 0 1.25rem;
        color: var(--muted);
      }
      .bio {
        margin: 0 0 1.25rem;
      }

      nav {
        font-size: 0.875rem;
      }
      nav span {
        color: var(--muted);
        margin: 0 0.4rem;
      }

      h1,
      .role,
      .bio,
      nav {
        overflow-wrap: anywhere;
      }

      a {
        color: inherit;
        text-decoration: underline;
        text-decoration-color: var(--rule);
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
        transition: text-decoration-color 150ms;
      }

      a:hover {
        text-decoration-color: var(--fg);
      }

      a:focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 3px;
        border-radius: 2px;
      }

      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @media (max-width: 480px) {
        main {
          padding-top: 4.5rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        main {
          animation: none;
        }
        a {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Duy Khanh</h1>
      <p class="role">Full-stack developer</p>
      <p class="bio">
        I build web apps end to end, from the interface to the server. I work
        mostly with React, Node.js, PHP, and TypeScript.
      </p>
      <nav aria-label="Links">
        <a href="https://github.com/khanhbuiswe">GitHub</a>
        <span aria-hidden="true">·</span>
        <a href="https://www.linkedin.com/in/duykhanh99">LinkedIn</a>
        <span aria-hidden="true">·</span>
        <a href="mailto:khanhbuiduy1999@gmail.com">Email</a>
      </nav>
    </main>
  </body>
</html>
